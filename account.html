<!DOCTYPE html>
<html lang="en">
$1
  <!-- Shared site navigation -->
  <link rel="stylesheet" href="/shared/shared-nav.css">
  <script src="/shared/shared-nav.js" defer></script>
$2
<body>
<div class="page">

  <header id="site-header"></header>

  <main>
    <div class="container">
      <div class="account-grid">
        <section class="card">
          <h2>Profile</h2>
          <p class="sub">Manage your PromptSchola account and learning preferences.</p>

          <div class="field-row">
            <label>Email</label>
            <p class="muted-text" id="account-email">Loading…</p>
          </div>

          <div class="field-row">
            <label for="full-name">Full name</label>
            <input type="text" id="full-name" placeholder="Your name" />
          </div>

          <div class="field-row">
            <label for="goal">Learning goal (optional)</label>
            <input type="text" id="goal" placeholder="e.g., Ace my first-year physics course" />
          </div>

          <button class="btn-primary" id="save-profile">Save profile</button>
          <div id="account-message" class="account-message"></div>
        </section>

        <section class="card">
          <h2>Session & security</h2>
          <p class="sub">You can sign out of this device at any time.</p>

          <div class="field-row">
            <p class="muted-text">
              If you want to change your password, use the “Forgot password?” link on the sign-in page.
            </p>
          </div>

          <button class="btn-ghost" id="logout-btn">Log out</button>
        </section>
      </div>
    </div>
  </main>

  <footer>
    © 2025 PromptSchola. All rights reserved.
  </footer>
</div>

<!-- Supabase + shared auth helpers -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="auth.js"></script>

<script>
  const accountEmailEl = document.getElementById('account-email');
  const fullNameInput = document.getElementById('full-name');
  const goalInput = document.getElementById('goal');
  const saveProfileBtn = document.getElementById('save-profile');
  const logoutBtn = document.getElementById('logout-btn');
  const accountMessage = document.getElementById('account-message');

  function showMessage(msg, type = 'error') {
    accountMessage.textContent = msg;
    accountMessage.className = 'account-message ' + (type === 'success' ? 'success' : 'error');
  }

  async function loadProfile() {
    const user = await getCurrentUser();
    if (!user) {
      const redirect = encodeURIComponent('account.html');
      window.location.href = `auth.html?redirect=${redirect}`;
      return;
    }

    accountEmailEl.textContent = user.email || '(no email)';

    const { data: profile, error: profileError } = await supabaseClient
      .from('profiles')
      .select('full_name, goal')
      .eq('id', user.id)
      .maybeSingle();

    if (!profileError && profile) {
      fullNameInput.value = profile.full_name || '';
      goalInput.value = profile.goal || '';
    }
  }

  saveProfileBtn.addEventListener('click', async () => {
    showMessage('');
    const user = await getCurrentUser();
    if (!user) {
      showMessage('You are not signed in. Please log in again.');
      return;
    }

    const fullName = fullNameInput.value.trim();
    const goal = goalInput.value.trim();

    const { error } = await supabaseClient
      .from('profiles')
      .upsert({
        id: user.id,
        full_name: fullName || null,
        goal: goal || null,
        updated_at: new Date().toISOString()
      });

    if (error) {
      console.error(error);
      showMessage('Could not save profile.');
    } else {
      showMessage('Profile saved.', 'success');
    }
  });

  logoutBtn.addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    window.location.href = 'index.html';
  });

  loadProfile();
</script>
</body>
</html>
